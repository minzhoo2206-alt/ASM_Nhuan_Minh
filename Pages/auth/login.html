<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
    <h2 class="mb-1 text-center text-2xl font-bold text-slate-800">Đăng nhập</h2>
    <p class="mb-6 text-center text-sm text-gray-500">🌶️ Ăn Vặt Cay Quán</p>

    <div id="message"></div>

    <form id="authForm" novalidate class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-semibold text-slate-700">Email</label>
        <input id="email" name="email" type="email" placeholder="Nhập email của bạn" autocomplete="email"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none">
        <span data-error-for="email" class="text-xs text-red-600"></span>
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm font-semibold text-slate-700">Mật khẩu</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none">
        <span data-error-for="password" class="text-xs text-red-600"></span>
      </div>
      <button type="submit" class="w-full rounded-lg bg-orange-600 py-2.5 font-semibold text-white hover:bg-orange-700">Đăng nhập</button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-600">
      Chưa có tài khoản?
      <a href="/Pages/auth/signup.html" class="font-semibold text-orange-600 hover:underline">Đăng ký</a>
      <span class="mx-1">·</span>
      <a href="/Pages/auth/adminLogin.html" class="text-gray-500 hover:underline">Dành cho Admin</a>
    </p>
  </div>

  <script type="module">
    import AuthModel from "../../Models/AuthModel.js";
    import AuthView from "../../Views/AuthView.js";
    import AuthController from "../../Controllers/AuthController.js";

    new AuthController(new AuthModel(), new AuthView(), "login");
  </script>
</body>
</html>
