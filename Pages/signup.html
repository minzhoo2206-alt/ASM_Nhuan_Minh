<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký tài khoản</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-card {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      width: 400px;
    }
    .register-card h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover {
      background: #218838;
    }
    .error-msg {
      color: red;
      font-size: 13px;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
    }
    .footer a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <h2>Đăng ký</h2>
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullname">Họ và tên</label>
        <input id="fullname" type="text" placeholder="Nhập tên của bạn!">
        <span id="errName" class="error-msg"></span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Nhập email của bạn!">
        <span id="errEmail" class="error-msg"></span>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="••••••••">
        <span id="errPass" class="error-msg"></span>
      </div>
      <div class="field">
        <label for="confirm">Xác nhận mật khẩu</label>
        <input id="confirm" type="password" placeholder="••••••••" >
        <span id="errConfirm" class="error-msg"></span>
      </div>
      <button class="btn" type="submit">Đăng ký</button>
    </form>
    <p class="footer">
      Đã có tài khoản? <a href="/Pages/login.html">Đăng nhập</a>
    </p>
  </div>

 <script src="/Compoment/signup.js"></script>
</body>
</html>
